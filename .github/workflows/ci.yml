name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: E2E com PostgreSQL isolado
        run: docker compose -p geracaotech-e2e -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tests
      - name: Encerrar ambiente E2E
        if: always()
        run: docker compose -p geracaotech-e2e -f docker-compose.test.yml down -v
