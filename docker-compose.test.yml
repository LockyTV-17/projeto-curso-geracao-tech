services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tarefas_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      - ./src/infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tarefas_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app:ro
      - /app/node_modules
    environment:
      TEST_DATABASE_URL: postgres://test:test@db-test:5432/tarefas_test
    command: ["sh", "-c", "npm ci && npm run test:e2e"]
    depends_on:
      db-test:
        condition: service_healthy
